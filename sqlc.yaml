version: "2"

sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/repository/queries"
    database:
      uri: "postgres://craftshelf:craftshelf_dev_pwd@localhost:5432/craftshelf?sslmode=disable"
    gen:
      go:
        package: "sqlc"
        out: "internal/repository/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "pg_catalog.uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
